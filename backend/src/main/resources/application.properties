spring.application.name=boxle
# Porta onde o sistema roda
server.port=8080

# Banco H2 gravado em arquivo, na pasta boxle-dados do usuário do Windows
spring.datasource.url=jdbc:h2:file:~/boxle-dados/boxle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL que o JPA executa
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tela do banco em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Manda a mensagem de erro para o front mostrar na tela
spring.web.error.include-message=always
